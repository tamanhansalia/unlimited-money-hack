<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; media-src clip-media: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>ViralClip Studio</title>
  <script type="module" src="./main.js"></script>
</head>
<body>

  <header class="topbar drag">
    <div class="topbar__bar glass no-drag">
      <a class="brand" href="#/" aria-label="ViralClip Studio, library">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="back" x="3" y="6" width="16" height="22" rx="6" fill="currentColor"/>
          <rect x="10" y="3" width="17" height="26" rx="6.5" fill="currentColor"/>
          <path class="glyph" d="M16.2 11.2v9.6a.9.9 0 0 0 1.37.77l7.1-4.8a.9.9 0 0 0 0-1.5l-7.1-4.8a.9.9 0 0 0-1.37.77Z"/>
        </svg>
        <span class="brand__name">ViralClip <span>Studio</span></span>
      </a>
      <nav class="topbar__nav" aria-label="Main">
        <a class="nav__item" href="#/" data-nav="library" aria-current="page"><i class="ph ph-squares-four" aria-hidden="true"></i><span class="nav__label">Library</span></a>
        <a class="nav__item" href="#/publishing" data-nav="publishing"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i><span class="nav__label">Publishing</span><span class="nav__dot" id="nav-publishing-dot" title="Not connected" hidden></span></a>
      </nav>
      <div class="topbar__spacer"></div>
      <div class="topbar__actions">
        <button class="job-pill" id="job-pill" type="button" hidden>
          <span class="ring" id="job-pill-ring"></span>
          <span class="job-pill__text truncate" id="job-pill-text">Generating…</span>
        </button>
        <button class="icon-btn" id="generation-settings" type="button" aria-label="Settings" title="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
        <button class="btn btn--primary" id="new-clips" type="button"><i class="ph ph-sparkle" aria-hidden="true"></i><span class="new-clips__label">New clips</span></button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage" tabindex="-1">
    <div class="views" id="views"></div>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
